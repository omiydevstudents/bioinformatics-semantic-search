<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omiy - Intelligent Bioinformatics Tool Discovery</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #1a1a1a;
            --bg-secondary: #2a2a2a;
            --bg-input: #222222;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --text-muted: #808080;
            --accent-primary: #20b8cd;
            --border-color: #404040;
            --border-focus: #20b8cd;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Main Container */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            max-width: 100vw;
            min-height: 100vh;
        }

        /* Logo */
        .logo {
            font-size: 3.5rem;
            font-weight: 400;
            color: var(--text-primary);
            margin-bottom: 3rem;
            letter-spacing: -0.02em;
        }

        /* Search Container */
        .search-container {
            width: 100%;
            max-width: 680px;
            position: relative;
            margin-bottom: 2rem;
        }

        .search-wrapper {
            position: relative;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 16px 60px 16px 20px;
            transition: all 0.2s ease;
        }

        .search-wrapper:focus-within {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 2px rgba(32, 184, 205, 0.1);
        }

        .search-input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            font-size: 1rem;
            color: var(--text-primary);
            font-family: inherit;
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-controls {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-button {
            background: var(--accent-primary);
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            color: white;
        }

        .search-button:hover {
            background: #1a9db5;
            transform: scale(1.05);
        }

        .search-button:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
            transform: none;
        }

        .control-icon {
            background: transparent;
            border: none;
            color: var(--text-muted);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .control-icon:hover {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        /* Quick Actions */
        .quick-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 3rem;
        }

        .action-chip {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 0.875rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .action-chip:hover {
            background: var(--bg-input);
            border-color: var(--border-focus);
            color: var(--text-primary);
        }

        /* Loading State */
        .loading {
            display: none;
            text-align: center;
            margin-top: 2rem;
        }

        .loading.active {
            display: block;
        }

        .loading-spinner {
            width: 24px;
            height: 24px;
            border: 2px solid var(--border-color);
            border-top: 2px solid var(--accent-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        /* Results Container */
        .results-container {
            width: 100%;
            max-width: 800px;
            margin-top: 2rem;
            display: none;
        }

        .results-container.active {
            display: block;
        }

        .results-header {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .results-meta {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .meta-value {
            color: var(--text-primary);
            font-weight: 500;
        }

        .confidence-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .confidence-high {
            background: rgba(32, 184, 205, 0.2);
            color: var(--accent-primary);
        }

        .confidence-medium {
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
        }

        .confidence-low {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        /* Tool Cards */
        .tools-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .tool-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.2s ease;
        }

        .tool-card:hover {
            border-color: var(--border-focus);
            background: #2d2d2d;
        }

        .tool-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .tool-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .tool-source {
            background: rgba(32, 184, 205, 0.15);
            color: var(--accent-primary);
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
        }

        .tool-description {
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 16px;
        }

        .tool-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tool-scores {
            display: flex;
            gap: 16px;
        }

        .score-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .score-bar {
            width: 40px;
            height: 3px;
            background: var(--border-color);
            border-radius: 2px;
            overflow: hidden;
        }

        .score-fill {
            height: 100%;
            background: var(--accent-primary);
            transition: width 0.3s ease;
        }

        .tool-actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            text-decoration: none;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
        }

        .btn-primary:hover {
            background: #1a9db5;
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-secondary);
        }

        .btn-secondary:hover {
            background: var(--bg-input);
            color: var(--text-primary);
        }

        /* Error State */
        .error-container {
            display: none;
            text-align: center;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 32px;
            margin-top: 2rem;
            max-width: 500px;
        }

        .error-container.active {
            display: block;
        }

        .error-icon {
            font-size: 2rem;
            color: #ef4444;
            margin-bottom: 1rem;
        }

        .error-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .error-message {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        /* Status Indicator */
        .status-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.875rem;
            color: var(--text-secondary);
            z-index: 1000;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-primary);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .main-container {
                padding: 1rem;
            }

            .logo {
                font-size: 2.5rem;
                margin-bottom: 2rem;
            }

            .search-wrapper {
                padding: 14px 50px 14px 16px;
            }

            .quick-actions {
                margin-bottom: 2rem;
            }

            .action-chip {
                font-size: 0.8rem;
                padding: 6px 12px;
            }

            .results-meta {
                flex-direction: column;
                gap: 8px;
            }
        }

        /* Hidden state for initial examples */
        .examples-hidden {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Status Indicator -->
    <div class="status-indicator">
        <div class="status-dot"></div>
        <span id="status-text">Initializing...</span>
    </div>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Logo -->
        <div class="logo">Omiy</div>

        <!-- Search Interface -->
        <div class="search-container">
            <div class="search-wrapper">
                <input 
                    type="text" 
                    class="search-input" 
                    id="search-input"
                    placeholder="Find bioinformatics tools for your research..."
                    autocomplete="off"
                >
                <div class="search-controls">
                    <button class="search-button" id="search-button">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="quick-actions" id="quick-actions">
            <div class="action-chip" onclick="useExample('protein sequence alignment tools')">
                <i class="fas fa-dna"></i>
                Sequence Analysis
            </div>
            <div class="action-chip" onclick="useExample('RNA-seq differential expression analysis')">
                <i class="fas fa-chart-line"></i>
                RNA-seq
            </div>
            <div class="action-chip" onclick="useExample('genome assembly software')">
                <i class="fas fa-puzzle-piece"></i>
                Assembly
            </div>
            <div class="action-chip" onclick="useExample('phylogenetic tree construction')">
                <i class="fas fa-sitemap"></i>
                Phylogenetics
            </div>
            <div class="action-chip" onclick="useExample('protein structure prediction')">
                <i class="fas fa-cube"></i>
                Structure
            </div>
        </div>

        <!-- Loading State -->
        <div class="loading" id="loading">
            <div class="loading-spinner"></div>
            <div class="loading-text">Searching across bioinformatics databases...</div>
        </div>

        <!-- Results Container -->
        <div class="results-container" id="results-container">
            <!-- Results Header -->
            <div class="results-header" id="results-header">
                <!-- Will be populated with search metadata -->
            </div>

            <!-- Tools List -->
            <div class="tools-list" id="tools-list">
                <!-- Tool cards will be populated here -->
            </div>
        </div>

        <!-- Error Container -->
        <div class="error-container" id="error-container">
            <div class="error-icon">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            <h3 class="error-title">Search Failed</h3>
            <p class="error-message" id="error-message"></p>
        </div>
    </div>

    <script>
        let isSearching = false;
        const searchInput = document.getElementById('search-input');
        const searchButton = document.getElementById('search-button');
        const quickActions = document.getElementById('quick-actions');
        const loading = document.getElementById('loading');
        const resultsContainer = document.getElementById('results-container');
        const errorContainer = document.getElementById('error-container');
        const statusText = document.getElementById('status-text');

        document.addEventListener('DOMContentLoaded', function() {
            checkSystemStatus();
            setupEventListeners();
        });

        function setupEventListeners() {
            searchInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && !isSearching) {
                    performSearch();
                }
            });

            searchButton.addEventListener('click', function() {
                if (!isSearching) {
                    performSearch();
                }
            });

            searchInput.addEventListener('input', function() {
                if (this.value.trim()) {
                    quickActions.style.display = 'none';
                } else {
                    quickActions.style.display = 'flex';
                }
            });
        }

        async function checkSystemStatus() {
            try {
                const response = await fetch('/api/status');
                const status = await response.json();
                
                if (status.status === 'ready') {
                    statusText.textContent = `${status.active_systems}/${status.total_systems} systems ready`;
                } else {
                    statusText.textContent = 'System error';
                }
            } catch (e) {
                statusText.textContent = 'Connection error';
            }
        }

        function useExample(query) {
            searchInput.value = query;
            performSearch();
        }

        async function performSearch() {
            const query = searchInput.value.trim();
            if (!query || isSearching) return;

            isSearching = true;
            showLoading();
            hideResults();
            hideError();

            try {
                const response = await fetch('/api/search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        query: query,
                        max_tools: 10
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Search failed');
                }

                const data = await response.json();
                displayResults(data);
                
            } catch (e) {
                showError(e.message);
            } finally {
                isSearching = false;
                hideLoading();
                updateSearchButton();
            }
        }

        function showLoading() {
            loading.classList.add('active');
            quickActions.style.display = 'none';
            searchButton.disabled = true;
            searchButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
        }

        function hideLoading() {
            loading.classList.remove('active');
        }

        function updateSearchButton() {
            searchButton.disabled = false;
            searchButton.innerHTML = '<i class="fas fa-search"></i>';
        }

        function displayResults(data) {
            hideLoading();
            resultsContainer.classList.add('active');

            const confidence = data.confidence_score;
            const confidenceClass = confidence >= 0.8 ? 'confidence-high' : 
                                  confidence >= 0.6 ? 'confidence-medium' : 'confidence-low';
            
            document.getElementById('results-header').innerHTML = `
                <div class="results-meta">
                    <div class="meta-item">
                        <i class="fas fa-clock"></i>
                        <span class="meta-value">${data.execution_time.toFixed(1)}s</span>
                    </div>
                    <div class="meta-item">
                        <i class="fas fa-database"></i>
                        <span class="meta-value">${data.systems_used.join(', ')}</span>
                    </div>
                    <div class="meta-item">
                        <i class="fas fa-tools"></i>
                        <span class="meta-value">${data.total_tools_found} tools</span>
                    </div>
                </div>
                <div class="confidence-badge ${confidenceClass}">
                    ${(confidence * 100).toFixed(0)}% confidence
                </div>
            `;

            const toolsList = document.getElementById('tools-list');
            toolsList.innerHTML = data.recommendations.map(tool => `
                <div class="tool-card">
                    <div class="tool-header">
                        <div>
                            <div class="tool-title">${tool.name}</div>
                            <span class="tool-source">${tool.source.replace('_', ' ')}</span>
                        </div>
                    </div>
                    
                    <div class="tool-description">${tool.description}</div>
                    
                    <div class="tool-footer">
                        <div class="tool-scores">
                            <div class="score-item">
                                <span>Relevance:</span>
                                <div class="score-bar">
                                    <div class="score-fill" style="width: ${tool.relevance_score * 100}%"></div>
                                </div>
                                <span>${(tool.relevance_score * 100).toFixed(0)}%</span>
                            </div>
                        </div>
                        <div class="tool-actions">
                            ${tool.url ? `<a href="${tool.url}" target="_blank" class="btn btn-primary">Visit</a>` : ''}
                            <button class="btn btn-secondary" onclick="copyToolInfo('${tool.name}')">
                                <i class="fas fa-copy"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function showError(message) {
            hideLoading();
            hideResults();
            document.getElementById('error-message').textContent = message;
            errorContainer.classList.add('active');
        }

        function hideError() {
            errorContainer.classList.remove('active');
        }

        function hideResults() {
            resultsContainer.classList.remove('active');
        }

        function copyToolInfo(toolName) {
            navigator.clipboard.writeText(toolName).then(() => {
                console.log('Tool name copied to clipboard');
            });
        }
    </script>
</body>
</html>
